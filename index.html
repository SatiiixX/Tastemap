const getWeekDates=(off=0)=>{const now=new Date(),day=now.getDay(),mon=new Date(now);mon.setDate(now.getDate()-(day===0?6:day-1)+off*7);return Array.from({length:7},(_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return`${String(d.getDate()).padStart(2,"0")}.${String(d.getMonth()+1).padStart(2,"0")}.${d.getFullYear()}`;});};

// Deterministic daily recipe by date
const getDailyRecipe=(recipes,typ,seed)=>{
  const pool=typ==="B"?recipes.filter(r=>r.typ==="B"):recipes.filter(r=>r.typ!=="B");
  if(!pool.length)return null;
  return pool[seed%pool.length];
};
const dateSeed=()=>{const d=new Date();return d.getFullYear()*10000+((d.getMonth()+1)*100)+d.getDate();};

// Parse chefkoch paste into clean comma-separated ingredients
const parseChefkochPaste=(text)=>{
  if(!text||!text.trim())return"";
  const lines=text.split(/
/).map(l=>l.trim()).filter(l=>l.length>1);
  const cleaned=lines.map(line=>{
    // Remove quantity patterns: "200 g", "1 EL", "½ TL", "2-3", "ca. 100ml" etc.
    let c=line
      .replace(/^\d+[\d,.\/\s]*\s*(g|kg|ml|l|EL|TL|Prise|Stück|Stk\.?|Zehe[n]?|Scheibe[n]?|Bund|Dose[n]?|Pck\.?|Packung|Becher|Tasse[n]?|Glas|Gläser|etwas|ca\.|½|¼|¾|\d+)\s*/i,"")
      .replace(/^[\d.,\s\/½¼¾]+\s*/,"")
      .replace(/\s*\(.*?\)/g,"")
      .trim();
    // Capitalize first letter
    if(c.length>0)c=c.charAt(0).toUpperCase()+c.slice(1);
    return c;
  }).filter(c=>c.length>2&&c.length<60);
  return [...new Set(cleaned)].join(", ");
};

// Zutat matching score
const matchScore=(recipe,sel)=>{
  if(!sel.length||!recipe.zutaten)return 0;
  const rz=(recipe.zutaten||"").toLowerCase();
  const hits=sel.filter(s=>rz.includes(s.toLowerCase())||s.toLowerCase().split(" ").some(w=>w.length>3&&rz.includes(w)));
  return hits.length/sel.length;
};

// ── CSS FACTORY ───────────────────────────────────────────────────────────────
const mkCSS=(dk,accent)=>`
@import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,500;0,9..144,700;1,9..144,400&family=DM+Sans:wght@400;500;600&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --a:${accent};--a2:${accent}dd;--abg:${accent}${dk?"22":"14"};
  --bg:${dk?"#0e0e0e":"#f4f1ed"};--bg2:${dk?"#181818":"#fff"};--bg3:${dk?"#222":"#ece8e2"};--bg4:${dk?"#2c2c2c":"#e2ddd6"};
  --b:${dk?"#2c2c2c":"#ddd8d0"};--t:${dk?"#ece8e2":"#18140e"};--t2:${dk?"#737373":"#8a7f72"};--t3:${dk?"#404040":"#c0b8ae"};
  --gr:#3d9462;--grbg:${dk?"rgba(61,148,98,.14)":"rgba(61,148,98,.09)"};
  --bl:#4478b0;--blbg:${dk?"rgba(68,120,176,.14)":"rgba(68,120,176,.09)"};
  --pu:#7050b0;--pubg:${dk?"rgba(112,80,176,.14)":"rgba(112,80,176,.09)"};
  --rd:#b83a3a;--rdbg:${dk?"rgba(184,58,58,.14)":"rgba(184,58,58,.09)"};
  --r:13px;--rs:8px;--rx:5px;
  --fd:'Fraunces',Georgia,serif;--fb:'DM Sans',system-ui,sans-serif;
  color-scheme:${dk?"dark":"light"};
}
body{background:var(--bg);color:var(--t);font-family:var(--fb);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;min-height:100vh;max-width:480px;margin:0 auto}
.hdr{padding:13px 16px 0;display:flex;align-items:center;justify-content:space-between}
.ht{font-family:var(--fd);font-size:22px;font-weight:500;letter-spacing:-.3px}.ht em{color:var(--a);font-style:italic}
.cnt{flex:1;overflow-y:auto;padding:12px 16px 92px}
/* tabbar */
.tbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--bg2);border-top:1px solid var(--b);display:flex;z-index:100;padding:4px 0 calc(env(safe-area-inset-bottom,0px)+4px)}
.tbtn{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:3px 0;background:none;border:none;cursor:pointer;color:var(--t2);font-family:var(--fb);font-size:9px;font-weight:600;transition:color .18s;text-transform:uppercase;letter-spacing:.03em}
.tbtn.on{color:var(--a)}.tbtn svg{transition:transform .18s}.tbtn.on svg{transform:translateY(-1px)}
/* modal */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .18s}
.mo{background:var(--bg2);border-radius:var(--r);width:100%;max-width:440px;max-height:90vh;overflow-y:auto;padding:20px 18px 28px;animation:pop .2s ease;box-shadow:0 24px 64px rgba(0,0,0,.28);position:relative}
.mo-close{position:absolute;top:14px;right:14px;background:var(--bg3);border:none;border-radius:50%;width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--t2);transition:background .13s}.mo-close:hover{background:var(--bg4)}
.mot{font-family:var(--fd);font-size:18px;font-weight:700;margin-bottom:12px;line-height:1.3;padding-right:36px}
.mol{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--t2);margin-bottom:4px;margin-top:10px}
.mov{font-size:13px;line-height:1.6}
/* cards */
.card{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:11px 13px;margin-bottom:7px;cursor:pointer;transition:border-color .14s,box-shadow .14s}
.card:hover{border-color:var(--a);box-shadow:0 2px 12px rgba(0,0,0,.08)}.card:active{transform:scale(.99)}
.cn{font-family:var(--fd);font-size:14px;font-weight:600;line-height:1.3;margin-bottom:4px}
.cd{font-size:12px;color:var(--t2);margin-bottom:5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
/* tags */
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tg{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:20px;font-size:11px;font-weight:600}
.ta{background:var(--abg);color:var(--a)}.tgr{background:var(--grbg);color:var(--gr)}
.tb{background:var(--blbg);color:var(--bl)}.tp{background:var(--pubg);color:var(--pu)}
/* search */
.sw{position:relative;margin-bottom:9px}
.si{width:100%;background:var(--bg2);border:1.5px solid var(--b);border-radius:var(--rs);padding:8px 11px 8px 35px;font-family:var(--fb);font-size:13px;color:var(--t);outline:none;transition:border-color .2s}.si:focus{border-color:var(--a)}
.sic{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--t3);pointer-events:none}
/* chips */
.fr{display:flex;gap:5px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}.fr::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:3px 10px;border-radius:20px;border:1.5px solid var(--b);background:var(--bg2);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;transition:all .13s;font-family:var(--fb)}.chip.on{background:var(--a);border-color:var(--a);color:#fff}
/* buttons */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 12px;border-radius:var(--rs);border:none;cursor:pointer;font-family:var(--fb);font-size:12px;font-weight:600;transition:all .13s;white-space:nowrap}
.bp{background:var(--a);color:#fff}.bp:hover{filter:brightness(1.1)}
.bg{background:var(--bg3);color:var(--t);border:1px solid var(--b)}.bg:hover{border-color:var(--a);color:var(--a)}
.bd{background:var(--rdbg);color:var(--rd)}
.brow{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
/* form */
.fg{margin-bottom:10px}
.fl{display:block;font-size:10px;font-weight:700;color:var(--t2);margin-bottom:3px;text-transform:uppercase;letter-spacing:.05em}
.fi,.fs,.ft{width:100%;background:var(--bg3);border:1.5px solid var(--b);border-radius:var(--rs);padding:7px 10px;font-family:var(--fb);font-size:13px;color:var(--t);outline:none;transition:border-color .2s}.fi:focus,.fs:focus,.ft:focus{border-color:var(--a)}
.ft{resize:vertical;min-height:65px}.fs option{background:var(--bg2)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
/* layout */
.sh{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.st{font-family:var(--fd);font-size:16px;font-weight:600}
.bdg{display:inline-flex;align-items:center;justify-content:center;min-width:17px;height:17px;background:var(--a);color:#fff;border-radius:9px;font-size:10px;font-weight:700;padding:0 4px;margin-left:5px}
.divider{height:1px;background:var(--b);margin:9px 0}
.cnote{font-size:11px;color:var(--t2);margin-bottom:8px}
.empty{text-align:center;padding:40px 16px;color:var(--t2)}.empty-i{font-size:32px;margin-bottom:8px}
.empty-t{font-family:var(--fd);font-size:15px;color:var(--t);margin-bottom:4px}
/* week */
.wn{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.wnb{background:var(--bg2);border:1.5px solid var(--b);border-radius:var(--rs);padding:4px;cursor:pointer;color:var(--t);display:flex;transition:border-color .14s}.wnb:hover{border-color:var(--a)}
.wg{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:11px}
.dc{background:var(--bg2);border:1.5px solid var(--b);border-radius:var(--rx);padding:5px 3px;text-align:center;cursor:pointer;transition:border-color .14s;min-height:64px;display:flex;flex-direction:column;align-items:center;gap:1px}
.dc:hover{border-color:var(--a)}.dc.today{border-color:var(--a);background:var(--abg)}.dc.has{border-color:var(--gr);background:var(--grbg)}
.dl{font-size:9px;font-weight:700;color:var(--t2);text-transform:uppercase}
.dd{font-size:9px;line-height:1.3;overflow:hidden;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical}
/* diary */
.de{background:var(--bg2);border:1px solid var(--b);border-radius:var(--rs);padding:9px 12px;margin-bottom:6px;display:flex;align-items:flex-start;gap:9px}
.ddt{font-size:11px;font-weight:700;color:var(--a);min-width:56px;padding-top:1px}
.dtx{flex:1;font-size:13px;line-height:1.5}
/* shopping */
.shi{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--bg2);border:1px solid var(--b);border-radius:var(--rs);margin-bottom:5px}
.shi.done{opacity:.32}.shi.done .sht{text-decoration:line-through}
.shc{width:19px;height:19px;border:2px solid var(--b);border-radius:4px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .13s}.shc.on{background:var(--gr);border-color:var(--gr);color:#fff}
.sht{flex:1;font-size:13px}
/* info tables */
.tbl{width:100%;border-collapse:collapse;font-size:12px;margin-bottom:11px}
.tbl th{background:var(--bg3);padding:6px 8px;text-align:left;font-weight:700;font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--t2);border-bottom:2px solid var(--b)}
.tbl td{padding:6px 8px;border-bottom:1px solid var(--b);vertical-align:top}.tbl tr:hover td{background:var(--bg3)}
.pill{display:inline-block;padding:1px 6px;border-radius:8px;font-size:10px;font-weight:600}
.ph{background:var(--grbg);color:var(--gr)}.pm{background:var(--abg);color:var(--a)}.pl{background:var(--blbg);color:var(--bl)}
.tpills{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:7px;margin-bottom:9px}.tpills::-webkit-scrollbar{display:none}
.tpill{padding:4px 11px;border-radius:20px;border:1.5px solid var(--b);background:var(--bg2);color:var(--t2);font-size:11px;font-weight:600;cursor:pointer;white-space:nowrap;transition:all .13s;font-family:var(--fb)}.tpill.on{border-color:var(--a);color:var(--a);background:var(--abg)}
/* heatmap */
.hm{display:grid;grid-template-columns:repeat(auto-fill,10px);gap:2px;margin-bottom:10px}
.hmc{width:10px;height:10px;border-radius:2px;cursor:pointer;transition:transform .1s}.hmc:hover{transform:scale(1.3)}
/* reste */
.match-bar{height:4px;border-radius:2px;background:var(--b);margin-top:5px;overflow:hidden}
.match-fill{height:100%;border-radius:2px;background:var(--gr);transition:width .3s}
/* daily widget in week */
.daily-widget{background:linear-gradient(135deg,var(--a) 0%,var(--a2) 100%);border-radius:var(--r);padding:13px 15px;margin-bottom:13px;color:#fff;position:relative;overflow:hidden}
.daily-widget::after{content:'';position:absolute;top:-20px;right:-20px;width:80px;height:80px;background:rgba(255,255,255,.07);border-radius:50%}
.dw-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;opacity:.75;margin-bottom:2px}
.dw-name{font-family:var(--fd);font-size:15px;font-weight:600;line-height:1.3;margin-bottom:8px}
.dw-row{display:flex;gap:7px;flex-wrap:wrap}
.dw-btn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:var(--rx);border:none;cursor:pointer;font-family:var(--fb);font-size:11px;font-weight:700;transition:all .13s}
.dw-btn.pri{background:rgba(255,255,255,.2);color:#fff}.dw-btn.pri:hover{background:rgba(255,255,255,.3)}
.dw-btn.sec{background:rgba(0,0,0,.15);color:#fff}.dw-btn.sec:hover{background:rgba(0,0,0,.25)}
/* picker */
.plist{max-height:200px;overflow-y:auto;background:var(--bg3);border-radius:var(--rs);padding:3px}
.pitem{padding:7px 10px;border-radius:var(--rx);cursor:pointer;font-size:13px;transition:background .1s}.pitem:hover{background:var(--bg4)}
/* img ph */
.img-ph{width:100%;height:110px;background:var(--bg3);border-radius:var(--rs);display:flex;align-items:center;justify-content:center;color:var(--t3);margin-bottom:9px;flex-direction:column;gap:3px;font-size:10px}
.loader{display:inline-block;width:12px;height:12px;border:2px solid var(--b);border-top-color:var(--a);border-radius:50%;animation:spin .7s linear infinite}
/* settings */
.set-section{background:var(--bg2);border:1px solid var(--b);border-radius:var(--r);padding:14px 15px;margin-bottom:10px}
.set-title{font-family:var(--fd);font-size:14px;font-weight:600;margin-bottom:11px;display:flex;align-items:center;gap:7px}
.cat-row{display:flex;align-items:center;gap:7px;padding:5px 0;border-bottom:1px solid var(--b)}
.cat-row:last-child{border-bottom:none}
.color-swatch{width:28px;height:28px;border-radius:50%;cursor:pointer;border:3px solid transparent;transition:border-color .13s;flex-shrink:0}
.color-swatch.on{border-color:var(--t)}
/* daily popup */
.popup-bg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:300;display:flex;align-items:center;justify-content:center;padding:16px;animation:fi .2s}
.popup{background:var(--bg2);border-radius:calc(var(--r) + 4px);width:100%;max-width:380px;padding:26px 22px 24px;animation:pop .25s ease;box-shadow:0 32px 80px rgba(0,0,0,.35);text-align:center;position:relative}
@keyframes fi{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
@keyframes spin{to{transform:rotate(360deg)}}
`;

  const [manualDiceB,setManualDiceB]=useState(null);
  const [popupDetail,setPopupDetail]=useState(null);
  const dk=window.matchMedia("(prefers-color-scheme: dark)").matches;

  useEffect(()=>{
    (async()=>{
      const r=await sg("cp_r5");if(r?.length)setRecipes(r);
      const d=await sg("cp_d");
      if(d)setDiary(d);
      else{const b={};DR.forEach(e=>{if(e.essen)b[e.date]=e.essen;});setDiary(b);}
      const w=await sg("cp_w");if(w)setWeekPlan(w);
      const s=await sg("cp_s");if(s)setShopping(s);
      const id=await sg("cp_id");if(id)setInfoData(id);
      const st=await sg("cp_st");if(st)setSettings({...DEFAULT_SETTINGS,...st});
      // Show daily popup once per day
      const lastPopup=await sg("cp_popup_date");
      const td=todayStr();
      if(lastPopup!==td){setShowPopup(true);ss("cp_popup_date",td);}
      // Restore manual dice
      const md=await sg("cp_md");if(md){setManualDiceK(md.k||null);setManualDiceB(md.b||null);}
      setReady(true);
    })();
  },[]);

  useEffect(()=>{if(ready)ss("cp_r5",recipes);},[recipes,ready]);
  useEffect(()=>{if(ready&&diary!==null)ss("cp_d",diary);},[diary,ready]);
  useEffect(()=>{if(ready)ss("cp_w",weekPlan);},[weekPlan,ready]);
  useEffect(()=>{if(ready)ss("cp_s",shopping);},[shopping,ready]);
  useEffect(()=>{if(ready)ss("cp_id",infoData);},[infoData,ready]);
  useEffect(()=>{if(ready)ss("cp_st",settings);},[settings,ready]);
  useEffect(()=>{if(ready)ss("cp_md",{k:manualDiceK,b:manualDiceB});},[manualDiceK,manualDiceB,ready]);

  const seed=dateSeed();
  const dailyK=useMemo(()=>{
    if(manualDiceK)return recipes.find(r=>r.id===manualDiceK)||getDailyRecipe(recipes,"K",seed);
    return getDailyRecipe(recipes,"K",seed);
  },[recipes,manualDiceK,seed]);
  const dailyB=useMemo(()=>{
    if(manualDiceB)return recipes.find(r=>r.id===manualDiceB)||getDailyRecipe(recipes,"B",seed);
    return getDailyRecipe(recipes,"B",seed);
  },[recipes,manualDiceB,seed]);

  const rerollK=()=>{const pool=recipes.filter(r=>r.typ!=="B");setManualDiceK(pool[Math.floor(Math.random()*pool.length)]?.id||null);};
  const rerollB=()=>{const pool=recipes.filter(r=>r.typ==="B");setManualDiceB(pool[Math.floor(Math.random()*pool.length)]?.id||null);};

  const TABS=[
    {id:"rezepte",icon:"chef",label:"Rezepte"},
    {id:"verlauf",icon:"history",label:"Verlauf"},
    {id:"wochenplan",icon:"cal",label:"Woche"},
    {id:"einkauf",icon:"cart",label:"Einkauf"},
    {id:"reste",icon:"recycle",label:"Reste"},
    {id:"info",icon:"info",label:"Info"},
  ];

  const accent=settings.accentColor||"#c8702a";

  if(!ready||diary===null)return(
    <>
      <style dangerouslySetInnerHTML={{__html:mkCSS(dk,accent)}}/>
      <div style={{display:"flex",alignItems:"center",justifyContent:"center",minHeight:"100vh",flexDirection:"column",gap:10,color:"var(--t2)"}}>
        <span className="loader"style={{width:20,height:20}}/>
        <div style={{fontFamily:"var(--fd)",fontSize:14}}>Lade Cena Purgatio…</div>
      </div>
    </>
  );

  return(
    <>
      <style dangerouslySetInnerHTML={{__html:mkCSS(dk,accent)}}/>
      <div className="app">
        {/* Header */}
        <div className="hdr">
          <div className="ht">Cena <em>Purgatio</em></div>
          <div style={{display:"flex",alignItems:"center",gap:10}}>
            <div style={{fontSize:11,color:"var(--t2)",fontWeight:600}}>{recipes.length}</div>
            <button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)",padding:2,display:"flex",transition:"color .15s"}} onClick={()=>setShowSettings(true)}><Ic n="gear"s={20}/></button>
          </div>
        </div>

        <div className="cnt">
          {tab==="rezepte"&&<RezepteTab recipes={recipes}setRecipes={setRecipes}diary={diary}settings={settings}/>}
          {tab==="verlauf"&&<VerlaufTab diary={diary}setDiary={setDiary}recipes={recipes}/>}
          {tab==="wochenplan"&&<WochenplanTab weekPlan={weekPlan}setWeekPlan={setWeekPlan}recipes={recipes}setShopping={setShopping}shopping={shopping}dailyK={dailyK}dailyB={dailyB}onRerollK={rerollK}onRerollB={rerollB}onShowDetail={setPopupDetail}/>}
          {tab==="einkauf"&&<EinkaufTab shopping={shopping}setShopping={setShopping}recipes={recipes}/>}
          {tab==="reste"&&<ResteTab recipes={recipes}setRecipes={setRecipes}/>}
          {tab==="info"&&<InfoTab infoData={infoData}setInfoData={setInfoData}/>}
        </div>

        <nav className="tbar">
          {TABS.map(t=>(
            <button key={t.id}className={`tbtn ${tab===t.id?"on":""}`}onClick={()=>setTab(t.id)}>
              <Ic n={t.icon}s={20}/>{t.label}
            </button>
          ))}
        </nav>

        {/* Daily popup */}
        {showPopup&&dailyK&&(
          <div className="popup-bg"onClick={()=>setShowPopup(false)}>
            <div className="popup"onClick={e=>e.stopPropagation()}>
              <button className="mo-close"style={{position:"absolute",top:12,right:12}}onClick={()=>setShowPopup(false)}><Ic n="x"s={14}/></button>
              <div style={{fontSize:28,marginBottom:6}}>🍽️</div>
              <div style={{fontFamily:"var(--fd)",fontSize:11,fontWeight:700,textTransform:"uppercase",letterSpacing:".08em",color:"var(--a)",marginBottom:4}}>Vorschlag für heute</div>
              <div style={{fontFamily:"var(--fd)",fontSize:19,fontWeight:700,marginBottom:4,lineHeight:1.3}}>{dailyK.name}</div>
              {dailyK.art&&<div style={{fontSize:12,color:"var(--t2)",marginBottom:10}}>{dailyK.art}{dailyK.fleisch?` · ${dailyK.fleisch}`:""}</div>}
              {dailyB&&<div style={{background:"var(--bg3)",borderRadius:"var(--rs)",padding:"9px 12px",marginBottom:14,textAlign:"left"}}>
                <div style={{fontSize:10,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".06em",marginBottom:2}}>Backen heute</div>
                <div style={{fontFamily:"var(--fd)",fontSize:14,fontWeight:600}}>{dailyB.name}</div>
              </div>}
              <div style={{display:"flex",gap:7,justifyContent:"center",flexWrap:"wrap"}}>
                {dailyK.link&&<a href={dailyK.link}target="_blank"rel="noopener noreferrer"className="btn bp"style={{textDecoration:"none"}}><Ic n="link"s={12}/>Rezept öffnen</a>}
                <button className="btn bg"onClick={()=>{setShowPopup(false);setTab("wochenplan");}}>Zum Wochenplan</button>
                <button className="btn bg"onClick={()=>setShowPopup(false)}>Schließen</button>
              </div>
            </div>
          </div>
        )}

        {/* Popup recipe detail */}
        {popupDetail&&<RecipeDetail recipe={popupDetail}cookDates={[]}onClose={()=>setPopupDetail(null)}onEdit={null}onDelete={null}onUpdate={p=>{setRecipes(rs=>rs.map(r=>r.id===popupDetail.id?{...r,...p}:r));setPopupDetail(r=>({...r,...p}));}}/>}

        {/* Settings */}
        {showSettings&&<SettingsModal settings={settings}setSettings={setSettings}recipes={recipes}setRecipes={setRecipes}diary={diary}onClose={()=>setShowSettings(false)}/>}
      </div>
    </>
  );
}

// ── RECIPE DETAIL ──────────────────────────────────────────────────────────────
function RecipeDetail({recipe:r,cookDates,onClose,onEdit,onDelete,onUpdate}){
  const [loading,setLoading]=useState(false);
  const [msg,setMsg]=useState("");
  const isDrive=r.link?.includes("drive.google");

  const fetchPreview=async()=>{
    if(!r.link)return;
    setLoading(true);setMsg("Lade Vorschau…");
    try{
      const res=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:200,messages:[{role:"user",content:`Für das Rezept "${r.name}": Schreibe eine kurze appetitliche Beschreibung auf Deutsch (1-2 Sätze). Nur der Text, kein JSON, keine Erklärung.`}]})});
      const data=await res.json();
      const txt=data.content?.map(c=>c.text||"").join("").trim();
      if(txt&&txt.length>10){onUpdate({beschreibung:txt});setMsg("✓ Beschreibung gespeichert");}
      else setMsg("Keine Beschreibung gefunden");
    }catch{setMsg("Verbindungsfehler");}
    setLoading(false);setTimeout(()=>setMsg(""),3000);
  };

  const sorted=[...(cookDates||[])].sort().reverse();
  return(
    <div className="ov"onClick={onClose}>
      <div className="mo"onClick={e=>e.stopPropagation()}>
        <button className="mo-close"onClick={onClose}><Ic n="x"s={14}/></button>
        {r.bild?<img src={r.bild}alt=""style={{width:"100%",height:120,objectFit:"cover",borderRadius:"var(--rs)",marginBottom:9}}onError={e=>e.target.style.display="none"}/>:<div className="img-ph"><Ic n="img"s={18}/><span>Kein Bild</span></div>}
        <div className="mot">{r.name}</div>
        <div className="tags"style={{marginBottom:10}}>
          {r.typ&&<span className="tg tb">{r.typ==="K"?"Kochen":"Backen"}</span>}
          {r.fleisch&&<span className="tg ta">{r.fleisch}</span>}
          {r.nudeln&&<span className="tg tp">{r.nudeln}</span>}
          {r.art&&<span className="tg tgr">{r.art}</span>}
          {r.gut&&<span className="tg ta">⭐ Top</span>}
        </div>
        {r.beschreibung&&<><div className="mol">Beschreibung</div><div className="mov"style={{marginBottom:9,fontStyle:"italic",color:"var(--t2)"}}>{r.beschreibung}</div></>}
        {r.zutaten&&<><div className="mol">Zutaten</div><div className="mov"style={{marginBottom:9}}>{r.zutaten}</div></>}
        {r.kommentar&&<><div className="mol">Kommentar</div><div className="mov"style={{marginBottom:9,color:"var(--t2)"}}>{r.kommentar}</div></>}
        {sorted.length>0&&<><div className="mol">Zubereitet ({sorted.length}×)</div><div style={{display:"flex",flexWrap:"wrap",gap:4,marginBottom:9}}>{sorted.slice(0,8).map(d=><span key={d}className="tg tb"style={{fontSize:10}}>{d}</span>)}</div></>}
        <div className="brow">
          {r.link&&<a href={r.link}target="_blank"rel="noopener noreferrer"className="btn bp"style={{textDecoration:"none"}}><Ic n="link"s={12}/>{isDrive?"Drive":"Rezept öffnen"}</a>}
          {r.link&&!isDrive&&<button className="btn bg"onClick={fetchPreview}disabled={loading}>{loading?<span className="loader"/>:<Ic n="spark"s={12}/>}Vorschau</button>}
          {onEdit&&<button className="btn bg"onClick={onEdit}><Ic n="edit"s={12}/>Bearbeiten</button>}
          {onDelete&&<button className="btn bd"onClick={onDelete}><Ic n="trash"s={12}/></button>}
          <button className="btn bg"onClick={onClose}>Schließen</button>
        </div>
        {msg&&<div style={{marginTop:6,fontSize:11,color:"var(--t2)"}}>{msg}</div>}
      </div>
    </div>
  );
}

// ── RECIPE FORM ────────────────────────────────────────────────────────────────

  const [pasteText,setPasteText]=useState("");
  const s=(k,v)=>setF(x=>({...x,[k]:v}));

  const applyPaste=()=>{
    const result=parseChefkochPaste(pasteText);
    if(result){s("zutaten",result);setPasteMode(false);setPasteText("");}
  };

  const arts=settings?.artCategories||DEFAULT_SETTINGS.artCategories;

        <div className="fg"><label className="fl">Name *</label><input className="fi"value={f.name}onChange={e=>s("name",e.target.value)}placeholder="Rezeptname…"/></div>
        <div className="fg"><label className="fl">Link / URL</label><input className="fi"value={f.link}onChange={e=>s("link",e.target.value)}placeholder="https://…"/></div>
        <div className="fg"><label className="fl">Bild-URL</label><input className="fi"value={f.bild}onChange={e=>s("bild",e.target.value)}placeholder="https://…"/></div>
        <div className="fg"><label className="fl">Beschreibung</label><textarea className="ft"style={{minHeight:48}}value={f.beschreibung}onChange={e=>s("beschreibung",e.target.value)}placeholder="Kurze Beschreibung…"/></div>
        <div className="g2">
          <div className="fg"><label className="fl">Typ</label><select className="fs"value={f.typ}onChange={e=>s("typ",e.target.value)}><option value="K">Kochen</option><option value="B">Backen</option></select></div>
          <div className="fg"><label className="fl">Art</label>
            <select className="fs"value={f.art}onChange={e=>s("art",e.target.value)}>
              <option value="">–</option>{arts.map(a=><option key={a}value={a}>{a}</option>)}
            </select>
          </div>
          <div className="fg"><label className="fl">Fleisch</label>
            <select className="fs"value={f.fleisch}onChange={e=>s("fleisch",e.target.value)}>
              <option value="">–</option>{fleische.map(a=><option key={a}value={a}>{a}</option>)}
            </select>
          </div>
          <div className="fg"><label className="fl">Beilage</label>
            <select className="fs"value={f.nudeln}onChange={e=>s("nudeln",e.target.value)}>
              <option value="">–</option>{beilagen.map(a=><option key={a}value={a}>{a}</option>)}
            </select>
          </div>
        </div>
        {/* Zutaten with paste option */}
        <div className="fg">
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:3}}>
            <label className="fl"style={{marginBottom:0}}>Zutaten</label>
            <button className="btn bg"style={{padding:"2px 7px",fontSize:10}}onClick={()=>setPasteMode(p=>!p)}>
              {pasteMode?"Abbrechen":"Von Chefkoch einfügen"}

          {pasteMode?(
            <>
              <textarea className="ft"style={{minHeight:90,fontSize:12}}value={pasteText}onChange={e=>setPasteText(e.target.value)}placeholder={"Zutaten von Chefkoch hier einfügen…

Beispiel:
200 g Hähnchenbrust
2 EL Olivenöl
1 Zwiebel
Salz und Pfeffer"}autoFocus/>
              <button className="btn bp"style={{width:"100%",justifyContent:"center",marginTop:5,fontSize:12}}onClick={applyPaste}disabled={!pasteText.trim()}>
                <Ic n="check"s={12}/>Zutaten übernehmen
              </button>

          ):(
            <textarea className="ft"value={f.zutaten}onChange={e=>s("zutaten",e.target.value)}placeholder="Kommagetrennt, z.B. Hähnchenbrust, Sahne, Parmesan…"/>
          )}
        </div>
        <div className="fg"><label className="fl">Kommentar / Tipps</label><textarea className="ft"style={{minHeight:48}}value={f.kommentar}onChange={e=>s("kommentar",e.target.value)}placeholder="Tipps, Notizen…"/></div>

// ── REZEPTE TAB ────────────────────────────────────────────────────────────────
function RezepteTab({recipes,setRecipes,diary,settings}){
  const [q,setQ]=useState("");
  const [fA,setFA]=useState([]);
  const [fF,setFF]=useState([]);
  const [fN,setFN]=useState([]);
  const [fT,setFT]=useState([]);
  const [fG,setFG]=useState(false);
  const [showF,setShowF]=useState(false);
  const [sel,setSel]=useState(null);
  const [adding,setAdding]=useState(false);
  const [editing,setEditing]=useState(null);

  const arts=settings?.artCategories||DEFAULT_SETTINGS.artCategories;
  const fleische=settings?.fleischCategories||DEFAULT_SETTINGS.fleischCategories;
  const nudeln=settings?.beilageCategories||DEFAULT_SETTINGS.beilageCategories;
  const aF=fA.length+fF.length+fN.length+fT.length+(fG?1:0);
  const tog=(arr,set,v)=>set(a=>a.includes(v)?a.filter(x=>x!==v):[...a,v]);

  const cookMap=useMemo(()=>{
    if(!diary)return{};
    const m={};
    Object.entries(diary).forEach(([date,txt])=>{
      recipes.forEach(r=>{
        const key=r.name.toLowerCase().substring(0,Math.min(r.name.length,15));
        if(txt.toLowerCase().includes(key)){if(!m[r.id])m[r.id]=[];if(!m[r.id].includes(date))m[r.id].push(date);}
      });
    });
    return m;
  },[diary,recipes]);

  const filtered=useMemo(()=>{
    let res=recipes.filter(r=>{
      if(q){const ql=q.toLowerCase();if(!r.name.toLowerCase().includes(ql)&&!(r.zutaten||"").toLowerCase().includes(ql)&&!(r.beschreibung||"").toLowerCase().includes(ql))return false;}
      if(fA.length&&!fA.includes(r.art))return false;
      if(fF.length&&!fF.includes(r.fleisch))return false;
      if(fN.length&&!fN.includes(r.nudeln))return false;
      if(fT.length&&!fT.includes(r.typ))return false;
      if(fG&&!r.gut)return false;
      return true;
    });
    return res.sort((a,b)=>a.name.localeCompare(b.name,"de"));
  },[recipes,q,fA,fF,fN,fT,fG]);

  const handleSave=data=>{
    if(editing){setRecipes(rs=>rs.map(r=>r.id===editing.id?{...r,...data}:r));setSel({...editing,...data});setEditing(null);}
    else{setRecipes(rs=>[...rs,{...data,id:Date.now(),bild:"",beschreibung:"",kategorie:[],cook_history:[],gut:data.gut||false}].sort((a,b)=>a.name.localeCompare(b.name,"de")));setAdding(false);}
  };
  const handleDelete=id=>{setRecipes(rs=>rs.filter(r=>r.id!==id));setSel(null);};
  const updateR=(id,patch)=>{setRecipes(rs=>rs.map(r=>r.id===id?{...r,...patch}:r));setSel(s=>s?{...s,...patch}:s);};

  return(
    <>
      <div className="sh">
        <div className="st">Rezepte<span className="bdg">{filtered.length}</span></div>
        <div style={{display:"flex",gap:5}}>
          <button className="btn bg"style={{padding:"4px 8px",borderColor:aF?"var(--a)":"var(--b)",color:aF?"var(--a)":"var(--t)"}}onClick={()=>setShowF(f=>!f)}><Ic n="filter"s={13}/>{aF?` ${aF}`:""}</button>
          <button className="btn bp"style={{padding:"4px 9px"}}onClick={()=>setAdding(true)}><Ic n="plus"s={13}/>Neu</button>
        </div>
      </div>
      {showF&&(
        <div style={{background:"var(--bg3)",borderRadius:"var(--rs)",padding:"10px 12px",marginBottom:10}}>
          <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:8}}>
            <span style={{fontSize:10,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".05em"}}>Filter</span>
            <div style={{display:"flex",gap:5,alignItems:"center"}}>
              <button className={`chip ${fG?"on":""}`}style={{fontSize:10}}onClick={()=>setFG(f=>!f)}>⭐ Top</button>
              <button className={`chip ${fT.includes("K")?"on":""}`}onClick={()=>tog(fT,setFT,"K")}>Kochen</button>
              <button className={`chip ${fT.includes("B")?"on":""}`}onClick={()=>tog(fT,setFT,"B")}>Backen</button>
              {aF>0&&<button className="btn bg"style={{padding:"2px 7px",fontSize:10}}onClick={()=>{setFA([]);setFF([]);setFN([]);setFT([]);setFG(false);}}>Reset</button>}
            </div>
          </div>
          <FG label="Art"opts={arts}active={fA}onToggle={v=>tog(fA,setFA,v)}/>
          <FG label="Fleisch / Protein"opts={fleische}active={fF}onToggle={v=>tog(fF,setFF,v)}/>
          <FG label="Beilage"opts={nudeln}active={fN}onToggle={v=>tog(fN,setFN,v)}/>
        </div>
      )}
      <div className="sw"><span className="sic"><Ic n="search"s={13}/></span><input className="si"placeholder="Rezept, Zutat, Beschreibung…"value={q}onChange={e=>setQ(e.target.value)}/></div>
      <div className="cnote">{filtered.length} von {recipes.length}</div>
      {filtered.length===0&&<div className="empty"><div className="empty-i">🍽️</div><div className="empty-t">Nichts gefunden</div></div>}
      {filtered.map(r=>{
        const dates=cookMap[r.id]||r.cook_history||[];
        const lastDate=dates.length?[...dates].sort().reverse()[0]:"";
        return(
          <div key={r.id}className="card"onClick={()=>setSel(r)}>
            {r.bild&&<img src={r.bild}alt=""style={{width:"100%",height:100,objectFit:"cover",borderRadius:"var(--rs)",marginBottom:7,display:"block"}}onError={e=>e.target.style.display="none"}/>}
            <div className="cn">{r.name}</div>
            {r.beschreibung&&<div className="cd">{r.beschreibung}</div>}
            <div className="tags"style={{marginBottom:lastDate?4:0}}>
              {r.typ&&<span className="tg tb">{r.typ==="K"?"Kochen":"Backen"}</span>}
              {r.fleisch&&<span className="tg ta">{r.fleisch}</span>}
              {r.nudeln&&<span className="tg tp">{r.nudeln}</span>}
              {r.art&&<span className="tg tgr">{r.art}</span>}
              {r.gut&&<span className="tg ta">⭐</span>}
            </div>
            {lastDate&&<div style={{fontSize:11,color:"var(--t2)",marginTop:4}}>🕐 {lastDate}{dates.length>1?` · ${dates.length}×`:""}</div>}
          </div>
        );
      })}
      {sel&&<RecipeDetail recipe={sel}cookDates={cookMap[sel.id]||sel.cook_history||[]}onClose={()=>setSel(null)}onEdit={()=>{setEditing(sel);setSel(null);}}onDelete={()=>handleDelete(sel.id)}onUpdate={p=>updateR(sel.id,p)}/>}
      {(adding||editing)&&<RecipeForm initial={editing}onSave={handleSave}onClose={()=>{setAdding(false);setEditing(null);}}settings={settings}/>}
    </>
  );
}

// ── WOCHENPLAN ─────────────────────────────────────────────────────────────────

  const [pq,setPq]=useState("");

  const dates=getWeekDates(off);
  const td=todayStr();
  const wl=(()=>{const d0=dates[0].split("."),d6=dates[6].split(".");return`${d0[0]}.${d0[1]}. – ${d6[0]}.${d6[1]}.${d6[2]}`;})();

  const openEdit=d=>{setEditDay(d);setEditText(weekPlan[d]||"");setPq("");setShowP(false);};

    });
    if(items.length)setShopping(s=>[...s,...items]);

              <button className="dw-btn sec"onClick={()=>onShowDetail(dailyK)}>Details</button>
              {dailyK.link&&<a href={dailyK.link}target="_blank"rel="noopener noreferrer"className="dw-btn sec"style={{textDecoration:"none"}}><Ic n="link"s={10}/>Öffnen</a>}
            </div>
          </div>}
          {dailyB&&<div className="daily-widget"style={{background:"linear-gradient(135deg,#3d6a8a 0%,#2a4a6a 100%)"}}>
            <div className="dw-label">🎂 Backen</div>

              <button className="dw-btn pri"onClick={onRerollB}><Ic n="dice"s={11}/>Neu</button>

        <div style={{fontFamily:"var(--fd)",fontSize:14,fontWeight:600}}>{wl}</div>
        <button className="wnb"onClick={()=>setOff(o=>o+1)}><Ic n="cR"s={16}/></button>

            <button className="btn bg"onClick={()=>setEditDay(null)}>Schließen</button>
          </div>
        </div>
      </div>}
    </>
  );
}

// ── EINKAUF ────────────────────────────────────────────────────────────────────
function EinkaufTab({shopping,setShopping,recipes}){
  const [ni,setNi]=useState("");
  const [rp,setRp]=useState(false);
  const [pq,setPq]=useState("");
  const toggle=id=>setShopping(s=>s.map(i=>i.id===id?{...i,done:!i.done}:i));
  const remove=id=>setShopping(s=>s.filter(i=>i.id!==id));
  const clearDone=()=>setShopping(s=>s.filter(i=>!i.done));
  const add=()=>{if(!ni.trim())return;setShopping(s=>[...s,{id:Date.now(),text:ni.trim(),done:false}]);setNi("");};
  const addFromR=r=>{if(r.zutaten){const items=r.zutaten.split(",").map(s=>s.trim()).filter(Boolean);const newI=items.filter(t=>!shopping.find(s=>s.text===t)).map(t=>({id:Date.now()+Math.random(),text:t,done:false}));setShopping(s=>[...s,...newI]);}setRp(false);};
  const undone=shopping.filter(i=>!i.done),done=shopping.filter(i=>i.done);
  const pR=useMemo(()=>pq?recipes.filter(r=>r.name.toLowerCase().includes(pq.toLowerCase())&&r.zutaten):recipes.filter(r=>r.zutaten),[recipes,pq]);
  return(
    <>
      <div className="sh">
        <div className="st">Einkauf<span className="bdg">{undone.length}</span></div>
        {done.length>0&&<button className="btn bg"style={{padding:"3px 7px",fontSize:11}}onClick={clearDone}>Erledigt löschen</button>}
      </div>
      <div style={{display:"flex",gap:6,marginBottom:8}}>
        <input className="fi"style={{flex:1}}value={ni}onChange={e=>setNi(e.target.value)}placeholder="Artikel…"onKeyDown={e=>e.key==="Enter"&&add()}/>
        <button className="btn bp"style={{padding:"6px 10px"}}onClick={add}><Ic n="plus"s={14}/></button>

      {shopping.length===0&&<div className="empty"><div className="empty-i">🛒</div><div className="empty-t">Liste ist leer</div></div>}
      {undone.map(i=><div key={i.id}className="shi"><button className="shc"onClick={()=>toggle(i.id)}/><span className="sht">{i.text}</span><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)",padding:3}}onClick={()=>remove(i.id)}><Ic n="x"s={12}/></button></div>)}
      {done.length>0&&<><div className="divider"/><div style={{fontSize:10,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:5}}>Erledigt ({done.length})</div>
        {done.map(i=><div key={i.id}className="shi done"><button className="shc on"onClick={()=>toggle(i.id)}><Ic n="check"s={10}/></button><span className="sht">{i.text}</span><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)",padding:3}}onClick={()=>remove(i.id)}><Ic n="x"s={12}/></button></div>)}
      </>}
      {rp&&<div className="ov"onClick={()=>setRp(false)}>
        <div className="mo"onClick={e=>e.stopPropagation()}>
          <button className="mo-close"onClick={()=>setRp(false)}><Ic n="x"s={14}/></button>
          <div className="mot">Rezept wählen</div>
          <div className="sw"style={{marginBottom:7}}><span className="sic"><Ic n="search"s={13}/></span><input className="si"placeholder="Rezept suchen…"value={pq}onChange={e=>setPq(e.target.value)}autoFocus/></div>
          <div className="plist">{pR.slice(0,25).map(r=><div key={r.id}className="pitem"onClick={()=>addFromR(r)}><div style={{fontWeight:600,fontSize:13}}>{r.name}</div><div style={{fontSize:11,color:"var(--t2)",marginTop:1}}>{r.zutaten}</div></div>)}</div>
          <div className="brow"><button className="btn bg"onClick={()=>setRp(false)}>Schließen</button></div>
        </div>
      </div>}
    </>
  );
}

// ── RESTE ──────────────────────────────────────────────────────────────────────
function ResteTab({recipes,setRecipes}){
  const [selected,setSelected]=useState([]);
  const [input,setInput]=useState("");
  const [sugg,setSugg]=useState([]);
  const [sel,setSel]=useState(null);
  const QUICK=["Hähnchen","Hackfleisch","Sahne","Käse","Nudeln","Reis","Kartoffeln","Eier","Schinken","Speck","Tomaten","Gnocchi","Spätzle","Parmesan","Butter","Zwiebeln"];

  const allZ=useMemo(()=>{
    const pool=new Set();
    recipes.forEach(r=>{
      if(r.zutaten)r.zutaten.split(",").map(z=>z.trim().replace(/\d+[gmlkgEl\s]*/gi,"").trim()).filter(z=>z.length>2&&z.length<40).forEach(z=>pool.add(z));
      if(r.fleisch)pool.add(r.fleisch);
      if(r.nudeln)pool.add(r.nudeln);
    });
    return[...pool].sort((a,b)=>a.localeCompare(b,"de"));
  },[recipes]);

  const addZ=z=>{const c=z.trim();if(c&&!selected.includes(c)){setSelected(s=>[...s,c]);}setInput("");setSugg([]);};
  const remZ=z=>setSelected(s=>s.filter(x=>x!==z));
  const handleInput=e=>{const v=e.target.value;setInput(v);if(v.length>1){const vl=v.toLowerCase();setSugg(allZ.filter(z=>z.toLowerCase().includes(vl)).slice(0,8));}else setSugg([]);};

  const matches=useMemo(()=>{
    if(!selected.length)return[];
    return recipes.filter(r=>r.zutaten).map(r=>{
      const rz=(r.zutaten||"").toLowerCase();
      const hits=selected.filter(s=>rz.includes(s.toLowerCase())||s.toLowerCase().split(" ").some(w=>w.length>3&&rz.includes(w)));
      return{r,score:hits.length/selected.length,hits:hits.length};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score||b.hits-a.hits);
  },[recipes,selected]);

  return(
    <>
      <div className="sh"><div className="st">Resteverwertung</div>{selected.length>0&&<button className="btn bg"style={{padding:"3px 7px",fontSize:11}}onClick={()=>setSelected([])}>Leeren</button>}</div>
      <div style={{fontSize:12,color:"var(--t2)",marginBottom:10,lineHeight:1.5}}>Welche Zutaten sind noch da? Ich zeige dir passende Rezepte.</div>
      <div style={{position:"relative",marginBottom:10}}>
        <div className="sw"style={{marginBottom:0}}>
          <span className="sic"><Ic n="search"s={13}/></span>
          <input className="si"placeholder="Zutat eingeben…"value={input}onChange={handleInput}onKeyDown={e=>{if(e.key==="Enter"&&input.trim())addZ(input);}}/>
        </div>
        {sugg.length>0&&<div style={{position:"absolute",top:"100%",left:0,right:0,background:"var(--bg2)",border:"1.5px solid var(--a)",borderRadius:"var(--rs)",zIndex:50,overflow:"hidden",boxShadow:"0 8px 24px rgba(0,0,0,.15)"}}>
          {sugg.map(s=><div key={s}className="pitem"style={{padding:"8px 12px"}}onClick={()=>addZ(s)}>{s}</div>)}
        </div>}
      </div>
      <div style={{fontSize:10,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>Schnellauswahl</div>
      <div className="fr"style={{marginBottom:12}}>
        {QUICK.map(z=><button key={z}className={`chip ${selected.includes(z)?"on":""}`}onClick={()=>selected.includes(z)?remZ(z):addZ(z)}>{z}</button>)}
      </div>
      {selected.length>0&&<div style={{marginBottom:12}}>
        <div style={{fontSize:10,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:6}}>Ausgewählt ({selected.length})</div>
        <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
          {selected.map(z=><div key={z}style={{display:"inline-flex",alignItems:"center",gap:4,background:"var(--gr)",borderRadius:20,padding:"3px 8px 3px 10px",color:"#fff"}}>
            <span style={{fontSize:12,fontWeight:600}}>{z}</span>
            <button style={{background:"none",border:"none",cursor:"pointer",color:"rgba(255,255,255,.8)",padding:"0 1px",lineHeight:1,display:"flex"}}onClick={()=>remZ(z)}><Ic n="x"s={11}/></button>
          </div>)}
        </div>
      </div>}
      {selected.length>0&&<>
        <div className="sh"style={{marginBottom:8}}><div className="st">Passende Rezepte<span className="bdg">{matches.length}</span></div></div>
        {matches.length===0&&<div className="empty"><div className="empty-i">🔍</div><div className="empty-t">Keine Treffer</div><p style={{fontSize:12}}>Tipp: Zutaten bei Rezepten manuell nachtragen</p></div>}
        {matches.map(({r,score,hits})=>(
          <div key={r.id}className="card"onClick={()=>setSel(r)}>
            <div className="cn">{r.name}</div>
            <div className="tags"style={{marginBottom:5}}>
              {r.fleisch&&<span className="tg ta">{r.fleisch}</span>}
              {r.art&&<span className="tg tgr">{r.art}</span>}
              {r.gut&&<span className="tg ta">⭐</span>}
            </div>
            <div style={{fontSize:11,color:"var(--t2)",marginBottom:4}}>{hits} / {selected.length} Zutaten · {Math.round(score*100)}% Übereinstimmung</div>
            <div className="match-bar"><div className="match-fill"style={{width:`${score*100}%`}}/></div>
          </div>
        ))}
      </>}
      {selected.length===0&&<div className="empty"style={{padding:"30px 0"}}><div className="empty-i">🥘</div><div className="empty-t">Zutaten angeben</div><p style={{fontSize:12}}>Wähle was du da hast</p></div>}
      {sel&&<RecipeDetail recipe={sel}cookDates={sel.cook_history||[]}onClose={()=>setSel(null)}onEdit={null}onDelete={null}onUpdate={p=>{setRecipes(rs=>rs.map(r=>r.id===sel.id?{...r,...p}:r));setSel(s=>({...s,...p}));}}/>}
    </>
  );
}

function InfoTab({infoData,setInfoData}){
  const [sub,setSub]=useState("naehrwerte");
  const [q,setQ]=useState("");
  const [editRow,setEditRow]=useState(null);
  const [editTable,setEditTable]=useState(null);
  const SUBS=[{id:"naehrwerte",l:"Nährwerte"},{id:"obst",l:"Obst"},{id:"kohlenhydrate",l:"Beilagen"},{id:"zucker",l:"Zuckerfrei"},{id:"wein",l:"Wein"}];
  const TMPLS={naehrwerte:{name:"",protein:"",kcal:"",histamin:"",kategorie:""},obst:{name:"",kalorien:"",ballaststoffe:"",naehrstoffe:"",vorteile:""},kohlenhydrate:{name:"",kalorien:"",eiweiss:"",kohlenhydrate:"",fett:""},wein:{gericht:"",fuer:"",empfehlung:"",typ:"K"}};
  const upd=(t,i,p)=>setInfoData(d=>({...d,[t]:(d[t]||[]).map((r,idx)=>idx===i?{...r,...p}:r)}));
  const addR=(t,tmpl)=>{setInfoData(d=>({...d,[t]:[...(d[t]||[]),{...tmpl}]}));setEditRow((infoData[t]||[]).length);setEditTable(t);};
  const delR=(t,i)=>setInfoData(d=>({...d,[t]:(d[t]||[]).filter((_,idx)=>idx!==i)}));
  return(
    <>
      <div className="sh">
        <div className="st">Info & Tabellen</div>
        {TMPLS[sub]&&<button className="btn bp"style={{padding:"4px 8px",fontSize:11}}onClick={()=>addR(sub,TMPLS[sub])}><Ic n="plus"s={12}/>Neu</button>}
      </div>
      <div className="tpills">{SUBS.map(s=><button key={s.id}className={`tpill ${sub===s.id?"on":""}`}onClick={()=>{setSub(s.id);setQ("");}}>{s.l}</button>)}</div>
      <div className="sw"style={{marginBottom:9}}><span className="sic"><Ic n="search"s={13}/></span><input className="si"placeholder="Suchen…"value={q}onChange={e=>setQ(e.target.value)}/></div>
      {sub==="naehrwerte"&&<NahrTbl data={infoData.naehrwerte||[]}q={q}onEdit={i=>{setEditRow(i);setEditTable("naehrwerte");}}onDel={i=>delR("naehrwerte",i)}/>}
      {sub==="obst"&&<ObstTbl data={infoData.obst||[]}q={q}onEdit={i=>{setEditRow(i);setEditTable("obst");}}onDel={i=>delR("obst",i)}/>}
      {sub==="kohlenhydrate"&&<KohlenTbl data={infoData.kohlenhydrate||[]}q={q}onEdit={i=>{setEditRow(i);setEditTable("kohlenhydrate");}}onDel={i=>delR("kohlenhydrate",i)}/>}
      {sub==="zucker"&&<ZuckerTbl data={infoData.zucker_lebensmittel||[]}q={q}onAdd={x=>setInfoData(d=>({...d,zucker_lebensmittel:[...(d.zucker_lebensmittel||[]),x]}))}onDel={i=>setInfoData(d=>({...d,zucker_lebensmittel:(d.zucker_lebensmittel||[]).filter((_,idx)=>idx!==i)}))}/>}
      {sub==="wein"&&<WeinTbl data={infoData.wein||[]}q={q}onEdit={i=>{setEditRow(i);setEditTable("wein");}}onDel={i=>delR("wein",i)}/>}
      {editRow!==null&&editTable&&<InfoEdit table={editTable}data={(infoData[editTable]||[])[editRow]||{}}onSave={p=>{upd(editTable,editRow,p);setEditRow(null);setEditTable(null);}}onClose={()=>{setEditRow(null);setEditTable(null);}}/>}
    </>
  );
}
function InfoEdit({table,data,onSave,onClose}){
  const [f,setF]=useState({...data});const s=(k,v)=>setF(x=>({...x,[k]:v}));
  const FIELDS={naehrwerte:[["name","Name"],["kcal","kcal"],["protein","Protein"],["histamin","Histamin"],["kategorie","Kategorie"]],obst:[["name","Obstsorte"],["kalorien","kcal"],["ballaststoffe","Ballaststoffe (g)"],["naehrstoffe","Nährstoffe"],["vorteile","Vorteile"]],kohlenhydrate:[["name","Beilage"],["kalorien","kcal"],["eiweiss","Eiweiß"],["kohlenhydrate","KH"],["fett","Fett"]],wein:[["gericht","Gericht"],["fuer","Fleischart/Typ"],["empfehlung","Empfehlung"],["typ","K/B"]]}[table]||[];
  return(<div className="ov"onClick={onClose}><div className="mo"onClick={e=>e.stopPropagation()}>
    <button className="mo-close"onClick={onClose}><Ic n="x"s={14}/></button>
    <div className="mot">Eintrag bearbeiten</div>
    {FIELDS.map(([k,l])=><div key={k}className="fg"><label className="fl">{l}</label>{k==="empfehlung"?<textarea className="ft"style={{minHeight:55}}value={f[k]||""}onChange={e=>s(k,e.target.value)}/>:<input className="fi"value={f[k]||""}onChange={e=>s(k,e.target.value)}/>}</div>)}
    <div className="brow"><button className="btn bp"onClick={()=>onSave(f)}>Speichern</button><button className="btn bg"onClick={onClose}>Schließen</button></div>
  </div></div>);
}
const pC=v=>v==="Hoch"?"pm":"pl";
const hC=v=>v==="Gering"?"ph":v==="Hoch"?"pm":"pm";
function NahrTbl({data,q,onEdit,onDel}){
  const cats=useMemo(()=>["Alle",...[...new Set(data.map(d=>d.kategorie).filter(Boolean))].sort()],[data]);
  const [cat,setCat]=useState("Alle");const [srt,setSrt]=useState("name");
  const f=useMemo(()=>{let d=data.filter(x=>!q||(x.name||"").toLowerCase().includes(q.toLowerCase())||(x.kategorie||"").toLowerCase().includes(q.toLowerCase()));if(cat!=="Alle")d=d.filter(x=>x.kategorie===cat);return[...d].sort((a,b)=>srt==="kcal"?(parseInt(b.kcal)||0)-(parseInt(a.kcal)||0):(a.name||"").localeCompare(b.name||""));},[data,q,cat,srt]);
  return(<><div className="fr"style={{marginBottom:5}}><button className={`chip ${srt==="name"?"on":""}`}onClick={()=>setSrt("name")}>A–Z</button><button className={`chip ${srt==="kcal"?"on":""}`}onClick={()=>setSrt("kcal")}>↓ kcal</button></div>
  <div className="fr"style={{marginBottom:8}}>{cats.map(c=><button key={c}className={`chip ${cat===c?"on":""}`}onClick={()=>setCat(c)}>{c}</button>)}</div>
  <div className="cnote">{f.length} Einträge</div>
  <table className="tbl"><thead><tr><th>Lebensmittel</th><th>Protein</th><th>kcal</th><th>Histamin</th><th></th></tr></thead>
  <tbody>{f.map((r,i)=><tr key={i}><td style={{fontWeight:500}}>{r.name}</td><td><span className={`pill ${pC(r.protein)}`}>{r.protein}</span></td><td>{r.kcal}</td><td>{r.histamin&&<span className={`pill ${hC(r.histamin)}`}>{r.histamin}</span>}</td>
    <td style={{whiteSpace:"nowrap"}}><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onEdit(data.indexOf(r))}><Ic n="edit"s={11}/></button><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onDel(data.indexOf(r))}><Ic n="trash"s={11}/></button></td></tr>)}
  </tbody></table></>);
}
function ObstTbl({data,q,onEdit,onDel}){
  const [srt,setSrt]=useState("name");
  const f=useMemo(()=>{let d=data.filter(x=>!q||(x.name||"").toLowerCase().includes(q.toLowerCase()));return[...d].sort((a,b)=>srt==="kcal"?(parseInt(a.kalorien)||0)-(parseInt(b.kalorien)||0):(a.name||"").localeCompare(b.name||""));},[data,q,srt]);

    <td style={{whiteSpace:"nowrap"}}><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onEdit(data.indexOf(r))}><Ic n="edit"s={11}/></button><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onDel(data.indexOf(r))}><Ic n="trash"s={11}/></button></td></tr>)}

}
function KohlenTbl({data,q,onEdit,onDel}){
  const [srt,setSrt]=useState("name");
  const f=useMemo(()=>{let d=data.filter(x=>!q||(x.name||"").toLowerCase().includes(q.toLowerCase()));return[...d].sort((a,b)=>srt==="kcal"?(parseInt(a.kalorien)||0)-(parseInt(b.kalorien)||0):(a.name||"").localeCompare(b.name||""));},[data,q,srt]);
  return(<><div className="fr"style={{marginBottom:8}}><button className={`chip ${srt==="name"?"on":""}`}onClick={()=>setSrt("name")}>A–Z</button><button className={`chip ${srt==="kcal"?"on":""}`}onClick={()=>setSrt("kcal")}>↑ kcal</button></div>
  <div className="cnote">{f.length} Beilagen</div>
  <table className="tbl"><thead><tr><th>Beilage</th><th>kcal</th><th>Eiweiß</th><th>KH</th><th>Fett</th><th></th></tr></thead>
  <tbody>{f.map((r,i)=><tr key={i}><td style={{fontWeight:500}}>{r.name}</td><td>{r.kalorien}</td><td>{r.eiweiss}</td><td>{r.kohlenhydrate}</td><td>{r.fett}</td>
    <td style={{whiteSpace:"nowrap"}}><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onEdit(data.indexOf(r))}><Ic n="edit"s={11}/></button><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onDel(data.indexOf(r))}><Ic n="trash"s={11}/></button></td></tr>)}
  </tbody></table></>);
}
function ZuckerTbl({data,q,onAdd,onDel}){
  const [ni,setNi]=useState("");
  const f=useMemo(()=>{const clean=data.filter(x=>x.length>2&&x.length<60&&!/[.?!]$/.test(x)&&!/^\d/.test(x)&&!/Übersicht|Generell|enthalten|Vollkorn|Ernährung|Milchzucker|Blutzucker|Mineralstoffe|Energiequelle/.test(x));return q?clean.filter(x=>x.toLowerCase().includes(q.toLowerCase())):clean;},[data,q]);
  const add=()=>{if(ni.trim()){onAdd(ni.trim());setNi("");}};
  return(<><div style={{display:"flex",gap:6,marginBottom:8}}><input className="fi"style={{flex:1}}value={ni}onChange={e=>setNi(e.target.value)}placeholder="Lebensmittel hinzufügen…"onKeyDown={e=>e.key==="Enter"&&add()}/><button className="btn bp"style={{padding:"6px 10px"}}onClick={add}><Ic n="plus"s={13}/></button></div>
  <div className="cnote">{f.length} Einträge</div>
  <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
    {f.map((x,i)=><div key={i}style={{display:"inline-flex",alignItems:"center",gap:3,background:"var(--grbg)",borderRadius:20,padding:"3px 8px 3px 10px"}}><span style={{fontSize:12,fontWeight:600,color:"var(--gr)"}}>{x}</span><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--gr)",padding:"0 1px",lineHeight:1,display:"flex"}}onClick={()=>onDel(data.indexOf(x))}><Ic n="x"s={11}/></button></div>)}
  </div></>);
}
function WeinTbl({data,q,onEdit,onDel}){
  const f=useMemo(()=>[...data].filter(x=>!q||(x.gericht||"").toLowerCase().includes(q.toLowerCase())||(x.empfehlung||"").toLowerCase().includes(q.toLowerCase())).sort((a,b)=>(a.gericht||"").localeCompare(b.gericht||"")),[data,q]);

    <div style={{display:"flex",gap:3,flexShrink:0}}><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onEdit(data.indexOf(r))}><Ic n="edit"s={12}/></button><button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)"}}onClick={()=>onDel(data.indexOf(r))}><Ic n="trash"s={12}/></button></div>
  </div></div>)}</>);
}

// ── SETTINGS MODAL ─────────────────────────────────────────────────────────────
function SettingsModal({settings,setSettings,recipes,setRecipes,diary,onClose}){
  const [newCat,setNewCat]=useState({art:"",fleisch:"",beilage:""});
  const [confirmReset,setConfirmReset]=useState(false);
  const upd=(k,v)=>setSettings(s=>({...s,[k]:v}));
  const addCat=(key,val)=>{if(!val.trim())return;const v=val.trim();upd(key,[...(settings[key]||[]),v].sort((a,b)=>a.localeCompare(b,"de")));setNewCat(n=>({...n,[key.replace("Categories","").toLowerCase()]:""}));};
  const delCat=(key,v)=>upd(key,(settings[key]||[]).filter(x=>x!==v));

  // Export helpers
  const exportJSON=(data,filename)=>{
    const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
    const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url);
  };
  const importRecipes=e=>{
    const file=e.target.files?.[0];if(!file)return;
    const reader=new FileReader();reader.onload=ev=>{try{const data=JSON.parse(ev.target.result);if(Array.isArray(data)){setRecipes(data);alert(`${data.length} Rezepte importiert`);}}catch{alert("Ungültige JSON-Datei");}};reader.readAsText(file);
  };

  const CatSection=({title,key,newKey})=>(
    <div style={{marginBottom:14}}>
      <div style={{fontSize:11,fontWeight:700,color:"var(--t2)",textTransform:"uppercase",letterSpacing:".05em",marginBottom:7}}>{title}</div>
      <div style={{display:"flex",flexWrap:"wrap",gap:5,marginBottom:7}}>
        {(settings[key]||[]).map(c=><div key={c}style={{display:"inline-flex",alignItems:"center",gap:3,background:"var(--bg3)",borderRadius:20,padding:"3px 9px 3px 11px",border:"1px solid var(--b)"}}>
          <span style={{fontSize:12,fontWeight:600}}>{c}</span>
          <button style={{background:"none",border:"none",cursor:"pointer",color:"var(--t2)",padding:"0 1px",lineHeight:1,display:"flex"}}onClick={()=>delCat(key,c)}><Ic n="x"s={11}/></button>
        </div>)}
      </div>
      <div style={{display:"flex",gap:6}}>
        <input className="fi"style={{flex:1,fontSize:12}}value={newCat[newKey]}onChange={e=>setNewCat(n=>({...n,[newKey]:e.target.value}))}placeholder={`Neue ${title.replace(" verwalten","")}…`}onKeyDown={e=>e.key==="Enter"&&addCat(key,newCat[newKey])}/>
        <button className="btn bp"style={{padding:"5px 9px"}}onClick={()=>addCat(key,newCat[newKey])}><Ic n="plus"s={13}/></button>
      </div>
    </div>
  );

  return(
    <div className="ov"onClick={onClose}>
      <div className="mo"style={{maxHeight:"92vh"}}onClick={e=>e.stopPropagation()}>
        <button className="mo-close"onClick={onClose}><Ic n="x"s={14}/></button>
        <div className="mot">Einstellungen</div>

        {/* Accent color */}
        <div className="set-section">
          <div className="set-title"><Ic n="palette"s={16}/>Akzentfarbe</div>
          <div style={{display:"flex",gap:10,flexWrap:"wrap"}}>
            {ACCENT_COLORS.map(c=>(
              <div key={c.v}style={{textAlign:"center"}}>
                <div className={`color-swatch ${settings.accentColor===c.v?"on":""}`}style={{background:c.v}}onClick={()=>upd("accentColor",c.v)}/>
                <div style={{fontSize:10,color:"var(--t2)",marginTop:3}}>{c.name}</div>
              </div>
            ))}
          </div>
        </div>

        {/* Categories */}
        <div className="set-section">
          <div className="set-title"><Ic n="tag"s={16}/>Kategorien</div>
          <CatSection title="Art verwalten"key="artCategories"newKey="art"/>
          <div className="divider"/>
          <CatSection title="Fleisch verwalten"key="fleischCategories"newKey="fleisch"/>
          <div className="divider"/>
          <CatSection title="Beilage verwalten"key="beilageCategories"newKey="beilage"/>
        </div>

        {/* Data */}
        <div className="set-section">
          <div className="set-title"><Ic n="dl"s={16}/>Daten</div>
          <div style={{display:"flex",flexDirection:"column",gap:7}}>
            <button className="btn bg"style={{justifyContent:"flex-start"}}onClick={()=>exportJSON(recipes,`cena-purgatio-rezepte-${todayStr().replace(/\./g,"-")}.json`)}>
              <Ic n="dl"s={13}/>Rezepte als JSON exportieren ({recipes.length})
            </button>
            <label className="btn bg"style={{cursor:"pointer",justifyContent:"flex-start"}}>
              <Ic n="upload"s={13}/>Rezepte importieren (JSON)
              <input type="file"accept=".json"style={{display:"none"}}onChange={importRecipes}/>
            </label>
            <button className="btn bg"style={{justifyContent:"flex-start"}}onClick={()=>exportJSON(Object.entries(diary||{}).map(([date,essen])=>({date,essen})),`cena-purgatio-verlauf-${todayStr().replace(/\./g,"-")}.json`)}>
              <Ic n="dl"s={13}/>Verlauf als JSON exportieren ({Object.keys(diary||{}).length} Einträge)
            </button>
          </div>
        </div>

        {/* Reset */}
        <div className="set-section">
          <div className="set-title"style={{color:"var(--rd)"}}><Ic n="trash"s={16}/>Zurücksetzen</div>
          {!confirmReset?<button className="btn bd"onClick={()=>setConfirmReset(true)}>Alle Daten löschen…</button>:(
            <div>
              <div style={{fontSize:13,color:"var(--t2)",marginBottom:10}}>Wirklich alle gespeicherten Daten löschen? Rezepte werden auf Standard zurückgesetzt.</div>
              <div style={{display:"flex",gap:7}}>
                <button className="btn bd"onClick={async()=>{await ss("cp_r5",null);await ss("cp_d",null);await ss("cp_w",null);await ss("cp_s",null);await ss("cp_id",null);await ss("cp_md",null);setRecipes(RD);setConfirmReset(false);onClose();}}>Ja, löschen</button>
                <button className="btn bg"onClick={()=>setConfirmReset(false)}>Abbrechen</button>
              </div>
            </div>
          )}
        </div>

        <button className="btn bg"style={{width:"100%",justifyContent:"center",marginTop:4}}onClick={onClose}>Schließen</button>
      </div>
    </div>
  );
}
